security:
- hmac: []
tags:
- name: '#X Amz Target=AWSIESnowballJobManagementService.CreateLongTermPricing'
paths:
  /#X-Amz-Target=AWSIESnowballJobManagementService.CreateLongTermPricing:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: CreateLongTermPricing
      description: 'Creates a job with the long-term usage option for a device. The long-term usage is a 1-year or 3-year long-term pricing type for the device. You are billed upfront, and Amazon Web Services provides discounts for long-term pricing. '
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateLongTermPricingResult'
              examples:
                CreateLongTermPricing200Example:
                  summary: Default CreateLongTermPricing 200
                  x-microcks-default: true
                  value:
                    LongTermPricingId: example-value
        '480':
          description: InvalidResourceException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidResourceException'
              examples:
                CreateLongTermPricing480Example:
                  summary: Default CreateLongTermPricing 480
                  x-microcks-default: true
                  value: example-value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLongTermPricingRequest'
            examples:
              CreateLongTermPricingRequestExample:
                summary: Default CreateLongTermPricing request
                x-microcks-default: true
                value:
                  LongTermPricingType: example-value
                  IsLongTermPricingAutoRenew: example-value
                  SnowballType: example-value
      parameters:
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - AWSIESnowballJobManagementService.CreateLongTermPricing
      summary: Amazon Create Long Term Pricing
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=AWSIESnowballJobManagementService.CreateLongTermPricing'
components:
  schemas:
    LongTermPricingId:
      type: string
      pattern: LTPID[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}
      minLength: 41
      maxLength: 41
    SnowballType:
      type: string
      enum:
      - STANDARD
      - EDGE
      - EDGE_C
      - EDGE_CG
      - EDGE_S
      - SNC1_HDD
      - SNC1_SSD
      - V3_5C
      - V3_5S
      - RACK_5U_C
    CreateLongTermPricingRequest:
      type: object
      required:
      - LongTermPricingType
      - SnowballType
      title: CreateLongTermPricingRequest
      properties:
        LongTermPricingType:
          allOf:
          - $ref: '#/components/schemas/LongTermPricingType'
          - description: The type of long-term pricing option you want for the device, either 1-year or 3-year long-term pricing.
        IsLongTermPricingAutoRenew:
          allOf:
          - $ref: '#/components/schemas/JavaBoolean'
          - description: Specifies whether the current long-term pricing type for the device should be renewed.
        SnowballType:
          allOf:
          - $ref: '#/components/schemas/SnowballType'
          - description: The type of Snow Family devices to use for the long-term pricing job.
    JavaBoolean:
      type: boolean
    CreateLongTermPricingResult:
      type: object
      properties:
        LongTermPricingId:
          allOf:
          - $ref: '#/components/schemas/LongTermPricingId'
          - description: The ID of the long-term pricing type for the device.
    LongTermPricingType:
      type: string
      enum:
      - OneYear
      - ThreeYear
      - OneMonth
    InvalidResourceException: {}
  parameters:
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
