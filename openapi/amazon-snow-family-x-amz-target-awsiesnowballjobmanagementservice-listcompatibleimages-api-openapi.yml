security:
- hmac: []
tags:
- name: '#X Amz Target=AWSIESnowballJobManagementService.ListCompatibleImages'
paths:
  /#X-Amz-Target=AWSIESnowballJobManagementService.ListCompatibleImages:
    parameters:
    - $ref: '#/components/parameters/X-Amz-Content-Sha256'
    - $ref: '#/components/parameters/X-Amz-Date'
    - $ref: '#/components/parameters/X-Amz-Algorithm'
    - $ref: '#/components/parameters/X-Amz-Credential'
    - $ref: '#/components/parameters/X-Amz-Security-Token'
    - $ref: '#/components/parameters/X-Amz-Signature'
    - $ref: '#/components/parameters/X-Amz-SignedHeaders'
    post:
      operationId: ListCompatibleImages
      description: This action returns a list of the different Amazon EC2-compatible Amazon Machine Images (AMIs) that are owned by your Amazon Web Services accountthat would be supported for use on a Snow device. Currently, supported AMIs are based on the Amazon Linux-2, Ubuntu 20.04 LTS - Focal, or Ubuntu 22.04 LTS - Jammy images, available on the Amazon Web Services Marketplace. Ubuntu 16.04 LTS - Xenial (HVM) images are no longer supported in the Market, but still supported for use on devices through Amazon EC2 VM Import/Export and running locally in AMIs.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListCompatibleImagesResult'
              examples:
                ListCompatibleImages200Example:
                  summary: Default ListCompatibleImages 200
                  x-microcks-default: true
                  value:
                    CompatibleImages: example-value
                    NextToken: example-value
        '480':
          description: InvalidNextTokenException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidNextTokenException'
              examples:
                ListCompatibleImages480Example:
                  summary: Default ListCompatibleImages 480
                  x-microcks-default: true
                  value: example-value
        '481':
          description: Ec2RequestFailedException
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ec2RequestFailedException'
              examples:
                ListCompatibleImages481Example:
                  summary: Default ListCompatibleImages 481
                  x-microcks-default: true
                  value: example-value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListCompatibleImagesRequest'
            examples:
              ListCompatibleImagesRequestExample:
                summary: Default ListCompatibleImages request
                x-microcks-default: true
                value:
                  MaxResults: example-value
                  NextToken: example-value
      parameters:
      - name: MaxResults
        in: query
        schema:
          type: string
        description: Pagination limit
        required: false
      - name: NextToken
        in: query
        schema:
          type: string
        description: Pagination token
        required: false
      - name: X-Amz-Target
        in: header
        required: true
        schema:
          type: string
          enum:
          - AWSIESnowballJobManagementService.ListCompatibleImages
      summary: Amazon List Compatible Images
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      tags:
      - '#X Amz Target=AWSIESnowballJobManagementService.ListCompatibleImages'
components:
  schemas:
    ListLimit:
      type: integer
      minimum: 0
      maximum: 100
    CompatibleImage:
      type: object
      properties:
        AmiId:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The unique identifier for an individual Snow device AMI.
        Name:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: The optional name of a compatible image.
      description: A JSON-formatted object that describes a compatible Amazon Machine Image (AMI), including the ID and name for a Snow device AMI. This AMI is compatible with the device's physical hardware requirements, and it should be able to be run in an SBE1 instance on the device.
    Ec2RequestFailedException: {}
    ListCompatibleImagesRequest:
      type: object
      title: ListCompatibleImagesRequest
      properties:
        MaxResults:
          allOf:
          - $ref: '#/components/schemas/ListLimit'
          - description: The maximum number of results for the list of compatible images. Currently, a Snowball Edge device can store 10 AMIs.
        NextToken:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: HTTP requests are stateless. To identify what object comes "next" in the list of compatible images, you can specify a value for <code>NextToken</code> as the starting point for your list of returned images.
    String:
      type: string
      pattern: .*
      minLength: 1
      maxLength: 1024
    ListCompatibleImagesResult:
      type: object
      properties:
        CompatibleImages:
          allOf:
          - $ref: '#/components/schemas/CompatibleImageList'
          - description: A JSON-formatted object that describes a compatible AMI, including the ID and name for a Snow device AMI.
        NextToken:
          allOf:
          - $ref: '#/components/schemas/String'
          - description: Because HTTP requests are stateless, this is the starting point for your next list of returned images.
    InvalidNextTokenException: {}
    CompatibleImageList:
      type: array
      items:
        $ref: '#/components/schemas/CompatibleImage'
  parameters:
    X-Amz-Algorithm:
      name: X-Amz-Algorithm
      in: header
      schema:
        type: string
      required: false
    X-Amz-Credential:
      name: X-Amz-Credential
      in: header
      schema:
        type: string
      required: false
    X-Amz-Signature:
      name: X-Amz-Signature
      in: header
      schema:
        type: string
      required: false
    X-Amz-Content-Sha256:
      name: X-Amz-Content-Sha256
      in: header
      schema:
        type: string
      required: false
    X-Amz-Security-Token:
      name: X-Amz-Security-Token
      in: header
      schema:
        type: string
      required: false
    X-Amz-SignedHeaders:
      name: X-Amz-SignedHeaders
      in: header
      schema:
        type: string
      required: false
    X-Amz-Date:
      name: X-Amz-Date
      in: header
      schema:
        type: string
      required: false
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
