    GSTIN:
      type: string
      pattern: \d{2}[A-Z]{5}\d{4}[A-Z]{1}[A-Z\d]{1}[Z]{1}[A-Z\d]{1}
      minLength: 15
      maxLength: 15
    KMSRequestFailedException: {}
    Ec2RequestFailedException: {}
    EventTriggerDefinitionList:
